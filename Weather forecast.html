<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>お天気アプリ</title>
        <style>
            body {
                font-family: sans-serif;
                background-color: #1a1a2e;
                color: white;
                text-align: center;
                padding: 40px;
            }

            h1 {
                font-size: 32px;
                color: #f5c518;
            }
            .search-box {
                margin: 32px auto;
                display: flex;
                gap: 8px;
                justify-content: center;
            }

            input {
                padding: 10px 16px;
                border-radius: 20px;
                border: none;
                font-size: 15px;
                width: 200px;
            }

            button {
                padding: 10px 20px;
                border-radius: 20px;
                border: none;
                background: #f5c518;
                color: #1a1a2e;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
            }

        </style>
    </head>
    <body>
        <h1>☁️　weather forecast</h1>
        <p>天気を調べてみよう！</p>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="福岡">
            <button onclick="getWeather()">検索</button>
        </div>

        <div id="result"></div>
        <script>
            function getVuiName(weatherId) {
                if (weatherId >= 500 && weatherId < 600) {
                    return 'シャワーズ';  
                }
                if (weatherId === 800) {
                    return 'リーフィア';  
                }
                if (weatherId >= 200 && weatherId < 300) {
                  return　'サンダース';  // 雷雨
                }
                if (weatherId >= 600 && weatherId < 700) {
                    return 'グレイシア';  // 雪
                }
                if (weatherId >=803) {
                    return 'ブラッキー';  // 曇り
                }

                return 'イーブイ';
            }

            function getWeather() {
                const city = document.getElementById('cityInput').value;
                const API_KEY = '6df3b7537233f40fe2171f3946...';    
                const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric&lang=ja`;

                fetch(url)
                .then(response => response.json())
                .then(data => {
                    const temp = data.main.temp;
                    const desc = data.weather[0].description;
                    const name = data.name;

                    document.getElementById('result').innerHTML = `
                    <h2>${name}</h2>
                    <p>🫠 気温:${temp}℃</p>
                    <p>☁️ 天気:${desc}</p>
                    <p>🤍 キャラクター:${getVuiName(data.weather[0].id)}</p>
                    `;
                })
                .catch(error => {
                    document.getElementById('result').innerHTML = '<p>都市名が見つかりませんでした</p>';
                });
            }
        </script>
    </body>
</html>
